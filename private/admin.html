<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Confirmações</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card wide">
    <div class="admin-head">
      <h1>Confirmações</h1>
      <div class="head-right">
        <span class="live" id="live"><span class="dot"></span><span id="liveText">Conectando...</span></span>
        <button class="logout" id="btnLogout">Sair</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat yes" id="statYes">
        <div class="num" id="yes">0</div>
        <div class="label">Confirmados 🎉</div>
      </div>
      <div class="stat no" id="statNo">
        <div class="num" id="no">0</div>
        <div class="label">Não vão</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-filter="yes">Confirmados</button>
      <button class="tab" data-filter="no">Não vão</button>
      <button class="tab" data-filter="all">Todos</button>
    </div>
    <ul class="list" id="list"></ul>
  </main>

  <script src="admin.js"></script>
</body>
</html>
