<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Iniciar sessão</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card login">
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>
    </div>
    <h1>Área restrita</h1>
    <p class="sub">Inicia sessão para ver quem confirmou presença.</p>

    <form id="form" novalidate>
      <label class="field-label" for="user">Utilizador</label>
      <input type="text" id="user" autocomplete="username" autocapitalize="words" maxlength="60" required />

      <label class="field-label" for="pass">Palavra-passe</label>
      <div class="pass-wrap">
        <input type="password" id="pass" autocomplete="current-password" maxlength="200" required />
        <button type="button" class="show-pass" id="showPass" aria-label="Mostrar palavra-passe">Mostrar</button>
      </div>

      <button class="btn dark" id="btnLogin" type="submit">Entrar</button>
    </form>

    <p class="status" id="status" role="status"></p>
  </main>

  <script src="login.js"></script>
</body>
</html>
