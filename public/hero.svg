<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2e24"/>
      <stop offset=".55" stop-color="#17603f"/>
      <stop offset="1" stop-color="#3f9a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#d9f99d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d9f99d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#e0a21b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe3c4"/>
    </linearGradient>

    <!-- Capelo reutilizável -->
    <symbol id="cap" viewBox="-75 -30 150 95" overflow="visible">
      <path d="M-36 4 L-36 30 Q0 46 36 30 L36 4 Z" fill="#141417"/>
      <path d="M-70 -2 L0 22 L70 -2 L70 3 L0 27 L-70 3 Z" fill="#0b0b0d"/>
      <path d="M0 -26 L70 -2 L0 22 L-70 -2 Z" fill="url(#board)"/>
      <path d="M0 -26 L70 -2 L66 -1 L0 -22 Z" fill="#ffffff" opacity=".12"/>
      <path d="M0 -2 Q30 3 56 3 L56 36" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M50.5 35 L61.5 35 L64.5 60 L47.5 60 Z" fill="url(#gold)"/>
      <path d="M52 41 V59 M56 41 V59 M60 41 V59" stroke="#b7800f" stroke-width=".8" opacity=".7"/>
      <rect x="49.5" y="33" width="13" height="5" rx="2" fill="#f5c542"/>
      <circle cx="0" cy="-2" r="4.5" fill="url(#gold)"/>
    </symbol>

    <!-- Brilho de 4 pontas -->
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10 Z" fill="#fff6c9"/>
    </symbol>
  </defs>

  <rect width="360" height="170" fill="url(#bg)"/>
  <!-- arcos decorativos -->
  <circle cx="300" cy="-20" r="120" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="28"/>
  <circle cx="40" cy="200" r="90" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="20"/>
  <ellipse cx="180" cy="80" rx="150" ry="90" fill="url(#glow)"/>

  <!-- capelos jogados ao alto -->
  <use href="#cap" x="22" y="14" width="62" height="40" transform="rotate(-18 53 34)" opacity=".55"/>
  <use href="#cap" x="282" y="96" width="56" height="36" transform="rotate(16 310 114)" opacity=".5"/>
  <use href="#cap" x="290" y="12" width="40" height="26" transform="rotate(24 310 25)" opacity=".35"/>

  <!-- diploma -->
  <g transform="translate(120 128) rotate(-10)">
    <rect x="-46" y="-11" width="92" height="22" rx="11" fill="url(#paper)"/>
    <ellipse cx="46" cy="0" rx="6" ry="11" fill="#e4d4ac"/>
    <ellipse cx="46" cy="0" rx="2.6" ry="6" fill="#cdb983"/>
    <path d="M-40 -4 H30 M-40 2 H20" stroke="#d8c79c" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="-8" y="-12" width="10" height="24" fill="#c0392b"/>
    <path d="M-3 12 L-10 30 L-5 27 L-2 32 Z M-3 12 L4 30 L-1 27 L-4 32 Z" fill="#a93226"/>
    <circle cx="-3" cy="0" r="7" fill="#e0a21b"/>
    <circle cx="-3" cy="0" r="4" fill="#ffd970"/>
  </g>

  <!-- capelo principal -->
  <g transform="translate(196 74) rotate(-8)">
    <ellipse cx="0" cy="52" rx="58" ry="7" fill="#000" opacity=".22"/>
    <use href="#cap" x="-75" y="-30" width="150" height="95"/>
  </g>

  <!-- confetes -->
  <g>
    <rect x="96" y="24" width="7" height="3.5" rx="1" fill="#ffd970" transform="rotate(30 99 26)"/>
    <rect x="140" y="12" width="6" height="3" rx="1" fill="#a6e37f" transform="rotate(-25 143 13)"/>
    <rect x="258" y="40" width="7" height="3.5" rx="1" fill="#ff8fab" transform="rotate(50 261 42)"/>
    <rect x="270" y="146" width="7" height="3.5" rx="1" fill="#ffd970" transform="rotate(-40 273 148)"/>
    <rect x="58" y="96" width="6" height="3" rx="1" fill="#ffffff" transform="rotate(20 61 97)"/>
    <rect x="236" y="138" width="6" height="3" rx="1" fill="#a6e37f" transform="rotate(65 239 139)"/>
    <rect x="30" y="140" width="7" height="3.5" rx="1" fill="#ff8fab" transform="rotate(-15 33 141)"/>
    <rect x="226" y="16" width="6" height="3" rx="1" fill="#ffffff" transform="rotate(10 229 17)"/>
    <circle cx="118" cy="62" r="2" fill="#ffd970"/>
    <circle cx="262" cy="82" r="2.2" fill="#ffffff" opacity=".8"/>
    <circle cx="74" cy="64" r="1.8" fill="#a6e37f"/>
    <circle cx="166" cy="150" r="2" fill="#ffd970"/>
    <circle cx="330" cy="70" r="1.8" fill="#ff8fab"/>
    <circle cx="20" cy="88" r="1.6" fill="#ffffff" opacity=".7"/>
    <path d="M300 150 q4 -6 8 0 t8 0" fill="none" stroke="#ffd970" stroke-width="2" stroke-linecap="round"/>
    <path d="M76 40 q4 -6 8 0 t8 0" fill="none" stroke="#a6e37f" stroke-width="2" stroke-linecap="round"/>
    <path d="M160 34 q3 -5 6 0 t6 0" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- brilhos -->
  <use href="#spark" x="242" y="54" width="14" height="14"/>
  <use href="#spark" x="128" y="78" width="10" height="10" opacity=".85"/>
  <use href="#spark" x="320" y="128" width="12" height="12" opacity=".8"/>
  <use href="#spark" x="44" y="62" width="9" height="9" opacity=".7"/>
  <use href="#spark" x="186" y="6" width="9" height="9" opacity=".75"/>
</svg>
